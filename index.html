   <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e1b4b, #090514);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }

    .container{
        width: 100%;
        max-width: 700px;
        background-color: rgba(15, 12, 30, 0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0px 20px 50px rgba(0,0,0,0.6);
    }

    h1{
        text-align: center;
        background: linear-gradient(to right, #a5b4fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 40px;
        font-size: 42px;
        font-weight: 800;
    }

    h2{
        color: #94a3b8;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 35px;
        margin-bottom: 20px;
        border-left: 4px solid #6366f1;
        padding-left: 12px;
    }

    ul{
        list-style: none;
        margin-bottom: 25px;
    }

    li{
        margin-bottom: 12px;
    }

    a{
        display: block;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.03);
        color: #e2e8f0;
        padding: 16px 20px;
        border-radius: 14px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 16px;
    }

    a:hover{
        background: linear-gradient(90deg, rgba(99, 102, 241, 0.15), rgba(56, 189, 248, 0.15));
        color: #ffffff;
        border-color: #38bdf8;
        transform: translateY(-2px);
        box-shadow: 0px 8px 25px rgba(56, 189, 248, 0.2);
        padding-left: 28px;
    }
</style>

</head>
