<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Infinity Card Guard</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(135deg, #001219, #003049);
        }

        .container{

            width: 520px;

            background-color: rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);

            padding: 40px;

            border-radius: 25px;

            box-shadow: 0px 10px 30px rgba(0,0,0,0.4);

            border: 1px solid rgba(255,255,255,0.2);

            color: white;
        }

        h1{

            text-align: center;

            margin-bottom: 30px;

            color: #00d4ff;
        }

        label{

            font-weight: bold;

            display: block;

            margin-bottom: 10px;
        }

        input{

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            outline: none;

            font-size: 18px;

            background-color: rgba(255,255,255,0.12);

            color: white;

            transition: 0.3s;
        }

        input:focus{

            box-shadow: 0px 0px 15px rgba(0,212,255,0.5);
        }

        button{

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(135deg, #00d4ff, #0077b6);

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover{

            transform: scale(1.03);

            box-shadow: 0px 0px 20px rgba(0,212,255,0.5);
        }

        #resultado{

            margin-top: 25px;

            padding: 20px;

            border-radius: 15px;

            background-color: rgba(255,255,255,0.08);

            line-height: 35px;

            font-size: 18px;

            border-left: 5px solid #00d4ff;

            animation: aparecer 0.5s ease;
        }

        .valido{

            color: #00ff88;

            font-weight: bold;
        }

        .invalido{

            color: #ff4d6d;

            font-weight: bold;
        }

        .destaque{

            color: #00d4ff;

            font-weight: bold;
        }

        @keyframes aparecer{

            from{

                opacity: 0;
                transform: translateY(20px);
            }

            to{

                opacity: 1;
                transform: translateY(0px);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🛡️ Infinity Card Guard</h1>

        <label>Número do Cartão</label>

        <input type="text"
               id="cartao"
               placeholder="Digite o número do cartão">

        <button onclick="analisarCartao()">
            Analisar Cartão
        </button>

        <div id="resultado"></div>

    </div>

    <script src="Infinity Card Guard.js"></script>

</body>

</html>
