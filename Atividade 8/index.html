<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Infinity Bank</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(135deg, #000000, #1c1c1c);
        }

        .container{

            width: 450px;

            background-color: #111;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 10px 30px rgba(255, 204, 0, 0.3);

            border: 2px solid #ffcc00;

            text-align: center;
        }

        h1{

            color: #ffcc00;

            margin-bottom: 30px;

            font-size: 32px;
        }

        table{

            width: 100%;

            border-spacing: 15px;
        }

        td{

            text-align: left;
        }

        label{

            color: white;

            font-weight: bold;
        }

        input, select{

            width: 100%;

            padding: 12px;

            border: 2px solid #444;

            border-radius: 10px;

            background-color: #222;

            color: white;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus{

            border-color: #ffcc00;
        }

        button{

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background-color: #ffcc00;

            color: black;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover{

            background-color: #ffd633;

            transform: scale(1.02);
        }

        #resultado{

            margin-top: 25px;

            background-color: #1f1f1f;

            padding: 20px;

            border-radius: 15px;

            color: white;

            text-align: left;

            line-height: 35px;

            font-size: 18px;

            border-left: 5px solid #ffcc00;
        }

        .destaque{

            color: #ffcc00;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>💳 Infinity Bank</h1>

        <table>

            <tr>

                <td>
                    <label>Bandeira do Cartão</label>
                </td>

            </tr>

            <tr>

                <td>

                    <select id="bandeira">

                        <option value="visa">Visa</option>

                        <option value="master">Master</option>

                        <option value="elo">Elo</option>

                    </select>

                </td>

            </tr>

            <tr>

                <td>
                    <label>Valor da Venda</label>
                </td>

            </tr>

            <tr>

                <td>

                    <input type="number"
                           id="valor"
                           placeholder="Digite o valor da venda">

                </td>

            </tr>

            <tr>

                <td>
                    <label>Quantidade de Parcelas</label>
                </td>

            </tr>

            <tr>

                <td>

                    <input type="number"
                           id="parcelas"
                           placeholder="Digite o número de parcelas">

                </td>

            </tr>

        </table>

        <button onclick="calcular()">
            Calcular Venda
        </button>

        <div id="resultado"></div>

    </div>

    <script src="Infinite_Bank.js"></script>

</body>

</html>
